name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - sprint/foundation
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        if: hashFiles('backend/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test backend
        if: hashFiles('backend/pom.xml') != ''
        working-directory: backend
        run: mvn test

      - name: Package backend
        if: hashFiles('backend/pom.xml') != ''
        working-directory: backend
        run: mvn package -DskipTests

      - name: Backend project not ready
        if: hashFiles('backend/pom.xml') == ''
        run: echo "backend/pom.xml is not available yet; CI will run after the backend skeleton is merged."
