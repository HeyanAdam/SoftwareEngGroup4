name: Compose Check

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/compose-check.yml"
  push:
    branches:
      - main
      - sprint/foundation
    paths:
      - "deploy/**"
      - ".github/workflows/compose-check.yml"

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        working-directory: deploy
        run: docker compose --env-file .env.example config
