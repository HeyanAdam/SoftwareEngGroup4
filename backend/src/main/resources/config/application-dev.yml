logging:
  level:
    root: info
    com.group4.kaoyan: debug

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:kaoyan-files}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
