server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: kaoyan-backend
  # 全项目唯一的环境配置文件：deploy/.env（由 deploy/.env.example 复制）。
  # 同时兼容从仓库根目录和 backend/ 目录启动。
  config:
    import:
      - optional:file:./deploy/.env[.properties]
      - optional:file:../deploy/.env[.properties]
      - optional:file:./deploy/mail.env[.properties]
      - optional:file:../deploy/mail.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

  # ========== MySQL 数据源配置 ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/kaoyan_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:kaoyan}
    password: ${DB_PASSWORD:kaoyan123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      
  # ========== 关闭旧的 SQL 初始化，交由 Flyway 接管 ==========
  sql:
    init:
      mode: never

  # ========== Flyway 数据库迁移配置 ==========
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    validate-on-migrate: true

  # ========== Redis 配置 ==========
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5000

  # ========== 邮件（本地 Mailpit：SMTP 1025 / 收信页面 8025） ==========
  # 该段同时属于 P2 的 chore/platform-deps 范围，合并时保留一份即可
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        # 关键：Jakarta Mail 生成 Message-ID 时会调 InetAddress.getCanonicalHostName() 做反向 DNS，
        # Windows 上这一步会卡 20 秒（实测接口耗时 20.9s）。显式给 mail.from 后跳过该解析，
        # 实测降到 200ms 级。localhost 与超时是第二道保险。
        from: ${MAIL_FROM:no-reply@kaoyan.local}
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          localhost: ${MAIL_HELO_HOST:kaoyan.local}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_READ_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}

  # ============ RabbitMQ 配置 新增 ============
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:kaoyan}
    password: ${RABBITMQ_PWD:kaoyan123}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual

mybatis-plus:
  # MP 的 mybatis-plus.* 就是 MyBatis 的配置入口，不要再加 mybatis.* 前缀（两者只生效一个）
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.group4.kaoyan.modules,com.group4.kaoyan.platform
  type-handlers-package: com.group4.kaoyan.common.mybatis
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    jdbc-type-for-null: 'NULL'
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  # sa-token-redis-jackson 会自动注册 Redis SaTokenDao；登录会话与
  # token -> loginId 映射写入 spring.data.redis，不再保存在 JVM 内存。
  # 注意：真正生效的匿名白名单在 WebConfig.PUBLIC_PATHS，这里只做兜底同步，不要加业务路径。
  exclude-path:
    - /api/v1/auth/captcha
    - /api/v1/auth/verification-codes
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/auth/password-reset
    - /api/v1/health/**

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

kaoyan:
  # 对话生成：DeepSeek（OpenAI 兼容 /chat/completions，见 OpenAiLlmClient）
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    temperature: ${LLM_TEMPERATURE:0.3}
    max-tokens: ${LLM_MAX_TOKENS:2048}
    timeout-seconds: ${LLM_TIMEOUT:60}
    connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT:10}
    read-timeout-seconds: ${LLM_READ_TIMEOUT:60}
  # 向量化：千问 Embedding（DashScope 的 OpenAI 兼容端点，见 OpenAiEmbeddingClient）
  # 只负责把文档/问题转向量，不直接生成回答；维度必须与 Milvus collection 一致
  embedding:
    base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-v3}
    dimension: ${EMBEDDING_DIMENSION:1024}
    batch-size: ${EMBEDDING_BATCH_SIZE:16}
    timeout-seconds: ${EMBEDDING_TIMEOUT:30}
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection: ${MILVUS_COLLECTION:doc_chunk}
    dimension: ${EMBEDDING_DIMENSION:1024}
    top-k: ${VECTOR_TOP_K:6}
    score-threshold: ${VECTOR_SCORE_THRESHOLD:0.3}
  rag:
    chunk-size: ${CHUNK_SIZE:400}
    chunk-overlap: ${CHUNK_OVERLAP:80}
    history-rounds: ${HISTORY_ROUNDS:6}
  # ========== 认证模块（P1）：验证码、锁定、限流、发件人 ==========
  auth:
    captcha-ttl: ${AUTH_CAPTCHA_TTL:5m}
    captcha-max-attempts: ${AUTH_CAPTCHA_MAX_ATTEMPTS:3}
    email-code-ttl: ${AUTH_EMAIL_CODE_TTL:5m}
    email-code-interval: ${AUTH_EMAIL_CODE_INTERVAL:60s}
    email-code-ip-interval: ${AUTH_EMAIL_CODE_IP_INTERVAL:60s}
    email-code-max-attempts: ${AUTH_EMAIL_CODE_MAX_ATTEMPTS:5}
    login-max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
    login-lock-duration: ${AUTH_LOGIN_LOCK_DURATION:15m}
    login-failure-window: ${AUTH_LOGIN_FAILURE_WINDOW:30m}
    mail-from: ${MAIL_FROM:no-reply@kaoyan.local}
    mail-subject-prefix: "[考研AI导学系统]"
  realtime:
    ws-path: ${REALTIME_WS_PATH:/ws/chat}
    ticket-ttl: ${REALTIME_TICKET_TTL:60s}
    heartbeat-interval: ${REALTIME_HEARTBEAT_INTERVAL:30s}
    idle-timeout: ${REALTIME_IDLE_TIMEOUT:90s}
    max-message-bytes: ${REALTIME_MAX_MESSAGE_BYTES:32768}
    max-text-length: ${REALTIME_MAX_TEXT_LENGTH:4000}
    max-connections-per-user: ${REALTIME_MAX_CONNECTIONS_PER_USER:6}
    max-sends-per-window: ${REALTIME_MAX_SENDS_PER_WINDOW:6}
    send-rate-window: ${REALTIME_SEND_RATE_WINDOW:10s}
    max-concurrent-generations-per-user: ${REALTIME_MAX_CONCURRENT_PER_USER:2}
    max-concurrent-generations-per-connection: ${REALTIME_MAX_CONCURRENT_PER_CONNECTION:1}
    max-field-length: ${REALTIME_MAX_FIELD_LENGTH:64}
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  mq:
    # false：文档解析回退为本地 @Async，不走 Outbox/MQ（离线开发兜底）
    doc-parse-enabled: ${MQ_DOC_PARSE_ENABLED:true}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:kaoyan-files}
