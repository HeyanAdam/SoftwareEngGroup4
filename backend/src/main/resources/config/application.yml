server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: kaoyan-backend
  # 直接读取仓库根目录的 deploy/.env（复制 deploy/.env.example 一份即可，不用再配第二份）。
  # 后面的条目优先级更高，backend/env/.env 可用来做个人覆盖（可选，不提交）。
  config:
    import:
      - optional:file:./deploy/.env[.properties]
      - optional:file:../deploy/.env[.properties]
      - optional:file:./env/.env[.properties]
      - optional:file:../backend/env/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

  # ========== MySQL 数据源配置 ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/kaoyan_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:kaoyan}
    password: ${DB_PASSWORD:kaoyan123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  # 建表脚本幂等（CREATE TABLE IF NOT EXISTS），每次启动执行一次；
  # 这样即使中间件用 deploy/ 里的 MySQL（没有 initdb 挂载）也能自动建表。
  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

  # ========== Redis 配置 ==========
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5000

  # ============ RabbitMQ 配置 新增 ============
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:kaoyan}
    password: ${RABBITMQ_PWD:kaoyan123}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  exclude-path:
    - /api/kb
    - /api/kb/**
    - /api/auth/login
    - /api/auth/register
    - /health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

kaoyan:
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    temperature: ${LLM_TEMPERATURE:0.3}
    max-tokens: ${LLM_MAX_TOKENS:2048}
    timeout-seconds: ${LLM_TIMEOUT:60}
  embedding:
    base-url: ${EMBEDDING_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:bge-m3}
    dimension: ${EMBEDDING_DIMENSION:1024}
    batch-size: ${EMBEDDING_BATCH_SIZE:16}
    timeout-seconds: ${EMBEDDING_TIMEOUT:30}
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection: ${MILVUS_COLLECTION:doc_chunk}
    dimension: ${EMBEDDING_DIMENSION:1024}
    top-k: ${VECTOR_TOP_K:6}
    score-threshold: ${VECTOR_SCORE_THRESHOLD:0.3}
  rag:
    chunk-size: ${CHUNK_SIZE:400}
    chunk-overlap: ${CHUNK_OVERLAP:80}
    history-rounds: ${HISTORY_ROUNDS:6}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:kaoyan-files}