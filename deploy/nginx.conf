worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # WebSocket 升级映射：/ws/ 握手时把 Connection 切换为 upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 后端上游：后端运行在宿主机 8080；容器通过 host.docker.internal 访问宿主机。
    # 若后端改为 Compose 服务，把 server 改为对应服务名（如 backend:8080）。
    upstream kaoyan_api {
        server host.docker.internal:8080;
    }

    # 预压缩静态资源兜底 gzip（构建期 Vite 已产出 .gz；标准镜像含 gzip_static 模块）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2;
    gzip_vary on;

    server {
        listen 80;
        server_name localhost;

        # 前端生产构建产物目录（由 frontend.Dockerfile 从构建阶段拷入）
        root  /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # index.html 不做长期缓存：发版后必须能拿到最新入口，避免引用旧哈希资源
        location = /index.html {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # 带内容哈希的静态资源：长期缓存 + 不可变；优先使用构建期预压缩的 .gz
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf|eot)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            gzip_static on;
            access_log off;
        }

        # 后端 API：不走静态缓存
        location /api/ {
            proxy_pass http://kaoyan_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # WebSocket 聊天：保留 Upgrade 头与长连接超时
        location /ws/ {
            proxy_pass http://kaoyan_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SPA 深链接回退：前端路由（/study-plans、/chat、/admin/dashboard 等）刷新不 404
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
